<tr id="empleo-{{ j.id }}">
  <td style="font-weight:600;color:var(--primary);">{{ j.titulo[:38] }}{% if j.titulo|length > 38 %}…{% endif %}</td>
  <td style="color:var(--text-muted);font-size:13px;">{{ j.empresa }}</td>
  <td style="color:var(--text-muted);font-size:13px;">{{ j.ubicacion }}</td>
  <td><span class="tag" style="background:{% if j.activo %}rgba(16,185,129,0.1){% else %}rgba(239,68,68,0.1){% endif %};color:{% if j.activo %}#065f46{% else %}#b91c1c{% endif %};">{% if j.activo %}Activo{% else %}Inactivo{% endif %}</span></td>
  <td style="color:var(--text-muted);font-size:13px;">{{ j.publicado_at[:10] if j.publicado_at else '—' }}</td>
  <td>
    <div class="admin-acciones">
      {% if admin.nivel != 'soporte' %}
      <button class="admin-btn admin-btn-yellow" hx-post="/admin/empleos/{{ j.id }}/desactivar" hx-target="#empleo-{{ j.id }}" hx-swap="outerHTML">{% if j.activo %}⏸ Desactivar{% else %}▶ Activar{% endif %}</button>
      {% endif %}
      {% if admin.nivel == 'super_admin' %}
      <button class="admin-btn admin-btn-red" hx-post="/admin/empleos/{{ j.id }}/eliminar" hx-confirm="¿Eliminar este empleo permanentemente?" hx-target="#empleo-{{ j.id }}" hx-swap="outerHTML">🗑 Eliminar</button>
      {% endif %}
    </div>
  </td>
</tr>
