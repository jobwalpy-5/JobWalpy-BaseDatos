<aside style="width:220px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 12px;flex-shrink:0;min-height:100vh;position:sticky;top:0;height:100vh;">
  <a href="/" style="display:flex;align-items:center;gap:8px;margin-bottom:28px;padding:0 8px;text-decoration:none;">
    <img class="brand-logo-image" src="/static/img/logo.png" alt="" width="34" height="34" />
    <span class="logo-text" style="font-size:0.95rem;">JobWalpy</span>
    <span style="font-size:9px;background:rgba(1,47,94,0.08);color:var(--primary);border:1px solid rgba(1,47,94,0.2);padding:2px 6px;border-radius:8px;margin-left:auto;">ADMIN</span>
  </a>
  <span style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.7px;padding:0 8px;margin-bottom:4px;">General</span>
  <a href="/admin/dashboard" style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;text-decoration:none;font-size:13px;font-weight:500;margin-bottom:1px;{% if request.url.path == '/admin/dashboard' %}background:rgba(1,47,94,0.08);color:var(--primary);font-weight:600;{% else %}color:var(--text-soft);{% endif %}">Dashboard</a>
  <span style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.7px;padding:0 8px;margin:14px 0 4px;">Gestión</span>
  <a href="/admin/usuarios" style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;text-decoration:none;font-size:13px;font-weight:500;margin-bottom:1px;{% if '/admin/usuarios' in request.url.path %}background:rgba(1,47,94,0.08);color:var(--primary);font-weight:600;{% else %}color:var(--text-soft);{% endif %}">Usuarios</a>
  <a href="/admin/empresas" style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;text-decoration:none;font-size:13px;font-weight:500;margin-bottom:1px;{% if '/admin/empresas' in request.url.path %}background:rgba(1,47,94,0.08);color:var(--primary);font-weight:600;{% else %}color:var(--text-soft);{% endif %}">Empresas</a>
  <a href="/admin/empleos" style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;text-decoration:none;font-size:13px;font-weight:500;margin-bottom:1px;{% if '/admin/empleos' in request.url.path %}background:rgba(1,47,94,0.08);color:var(--primary);font-weight:600;{% else %}color:var(--text-soft);{% endif %}">Empleos</a>
  <div style="margin-top:auto;padding-top:14px;border-top:1px solid var(--border);">
    <div style="padding:6px 10px;margin-bottom:4px;">
      <div style="font-size:12px;font-weight:600;color:var(--text);">{{ admin.nombre }}</div>
      <div style="font-size:10px;color:var(--text-muted);">{{ admin.nivel | replace('_',' ') | title }}</div>
    </div>
    <a href="/admin/logout" style="display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:7px;text-decoration:none;color:var(--danger);font-size:12px;font-weight:600;">Cerrar sesión</a>
  </div>
</aside>
